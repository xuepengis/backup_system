# CPPLINT.cfg for backup_system project
#
# Project conventions that differ from default cpplint (Google C++ Style):
# 1. Interface headers named i*.hpp, implemented by e.g. file_filter.cpp
#    → include_order can't match source to header (unfixable naming)
# 2. Uses C++20 features including <filesystem>
# 3. Uses exact-width integer types for binary archive format compatibility
# 4. Uses top-level public:/private: (widely accepted in C++ community)
# 5. This is a personal/educational project — no copyright headers required
# 6. Line length > 80 chars is acceptable for modern C++ with templates

set noparent
linelength=120

# Unfixable due to project naming conventions (i*.hpp interface pattern)
filter=-build/include_order

# Unfixable due to cpplint tool limitations
filter=-build/c++17
filter=-runtime/int
filter=-whitespace/indent
filter=-legal/copyright
